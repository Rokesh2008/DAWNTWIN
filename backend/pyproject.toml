[project]
name = "dawntwin-backend"
version = "0.1.0"
description = "DAWNTWIN: Personalized Cardiovascular Digital Twin"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
